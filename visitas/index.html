<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Visitas do portfólio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap">
<style>
:root {
  --bg: #0c0b0a; --bg-2: #13110f; --bg-3: #1b1815; --fg: #efede8; --muted: #8a857d; --dim: #4a4640;
  --line: #2b2825; --accent: #ff5631; --font: "Archivo", Arial, sans-serif; --ease: cubic-bezier(.2, .7, .1, 1);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 500 16px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track, ::-webkit-scrollbar-corner { background: transparent; }
::-webkit-scrollbar-button { display: none; width: 0; height: 0; }
::-webkit-scrollbar-thumb { background: #4a4540; border: 3px solid transparent; background-clip: padding-box; border-radius: 99px; }
::-webkit-scrollbar-thumb:hover { background-color: var(--muted); }
::-webkit-scrollbar-thumb:active { background-color: var(--accent); }
@supports not selector(::-webkit-scrollbar) { * { scrollbar-width: thin; scrollbar-color: #4a4540 transparent; } }
.wrap { max-width: 1120px; margin: 0 auto; padding: 48px 40px 80px; }
.label { font-size: 12px; line-height: 1.35; font-weight: 600; font-variation-settings: "wdth" 115; letter-spacing: .045em; text-transform: uppercase; color: var(--muted); }
header { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; flex-wrap: wrap; margin-bottom: 36px; }
h1 { margin: 8px 0 0; font-weight: 900; font-variation-settings: "wdth" 62; text-transform: uppercase; font-size: clamp(48px, 7vw, 88px); line-height: .86; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 4px; }
.seg button { font: 700 14px/1 var(--font); color: var(--muted); background: none; border: 0; border-radius: 999px; padding: 11px 16px; cursor: pointer; transition: background .2s, color .2s; }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.seg button:hover:not([aria-pressed="true"]) { color: var(--fg); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }

.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.tile { padding: 24px 22px 26px; }
.tile + .tile { border-left: 1px solid var(--line); }
.tile b { display: block; margin-top: 10px; font-weight: 900; font-variation-settings: "wdth" 62; font-size: clamp(48px, 6vw, 76px); line-height: .9; font-variant-numeric: tabular-nums; }
.tile small { display: block; margin-top: 10px; color: var(--muted); font-size: 14px; line-height: 1.4; }

section { margin-top: 56px; }
h2 { margin: 0 0 18px; font-size: 22px; line-height: 1.2; font-weight: 800; }
h2 + .label { margin: -12px 0 20px; text-transform: none; letter-spacing: 0; font-size: 14px; font-weight: 500; font-variation-settings: normal; }

.chart { position: relative; border-bottom: 1px solid var(--dim); }
.bars { display: flex; align-items: flex-end; gap: 2px; height: 220px; }
.bar { flex: 1 1 0; min-width: 0; height: 100%; display: flex; align-items: flex-end; cursor: default; }
.bar i { display: block; width: 100%; background: var(--accent); border-radius: 4px 4px 0 0; min-height: 0; transition: opacity .2s; }
.bar.zero i { height: 2px !important; background: var(--line); border-radius: 0; }
.bars:hover .bar i { opacity: .45; }
.bars .bar:hover i { opacity: 1; }
.chart .max { position: absolute; left: 0; top: -2px; font-size: 12px; color: var(--muted); pointer-events: none; }
.chart .max::after { content: ""; position: absolute; left: 0; right: 0; }
.axis { display: flex; justify-content: space-between; margin-top: 10px; font-size: 12px; color: var(--muted); }
.tip { position: absolute; z-index: 5; pointer-events: none; background: var(--fg); color: var(--bg); border-radius: 10px; padding: 8px 12px; font-size: 13px; line-height: 1.3; white-space: nowrap; translate: -50% calc(-100% - 10px); opacity: 0; transition: opacity .15s; }
.tip.on { opacity: 1; }
.tip b { font-size: 16px; }

table { width: 100%; border-collapse: collapse; font-size: 15px; }
th { text-align: left; font-weight: 600; color: var(--muted); font-size: 12px; letter-spacing: .045em; text-transform: uppercase; font-variation-settings: "wdth" 115; padding: 0 12px 12px 0; border-bottom: 1px solid var(--line); }
td { padding: 14px 12px 14px 0; border-bottom: 1px solid var(--line); vertical-align: middle; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; padding-right: 0; padding-left: 12px; }
td.n { font-weight: 700; }
td.zero { color: var(--dim); font-weight: 500; }
.meter { display: flex; align-items: center; gap: 12px; }
.meter span { flex: 1; height: 8px; background: var(--bg-3); border-radius: 4px; overflow: hidden; }
.meter span i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; }
.scroll { overflow-x: auto; }
details { margin-top: 18px; }
summary { cursor: pointer; color: var(--muted); font-size: 14px; }
details table { margin-top: 12px; }
.msg { padding: 60px 0; color: var(--muted); font-size: 18px; max-width: 46ch; }
.note { margin-top: 56px; color: var(--dim); font-size: 13px; max-width: 70ch; }
@media (max-width: 820px) {
  .wrap { padding: 32px 16px 60px; }
  .tiles { grid-template-columns: 1fr 1fr; }
  .tile:nth-child(3) { border-left: 0; }
  .tile:nth-child(n+3) { border-top: 1px solid var(--line); }
  .cols { grid-template-columns: 1fr; gap: 0; }
  .bars { height: 160px; gap: 1px; }
  .tile { padding: 18px 14px 20px; }
}
</style>
</head>
<body>
<main class="wrap">
  <header>
    <div>
      <p class="label" style="margin:0">matheus-machado-dev.com.br</p>
      <h1>Visitas do portfólio</h1>
    </div>
    <div class="seg" role="group" aria-label="Período" id="periodo">
      <button type="button" data-d="7" aria-pressed="false">7 dias</button>
      <button type="button" data-d="30" aria-pressed="true">30 dias</button>
      <button type="button" data-d="90" aria-pressed="false">90 dias</button>
      <button type="button" data-d="365" aria-pressed="false">1 ano</button>
    </div>
  </header>
  <div id="conteudo"><p class="msg">Carregando...</p></div>
  <p class="note">Conta visitas (uma por sessão do navegador), projetos abertos, compartilhamentos e quem chegou por um link compartilhado. Não guarda IP, cookie nem nada que identifique quem visitou. Robôs e prévias de link não contam.</p>
</main>
<script src="/scripts/dados.js"></script>
<script>
(function () {
  "use strict";
  var $ = function (s) { return document.querySelector(s); };
  var box = $("#conteudo");
  var NOMES = {};
  ((window.MM_DATA && window.MM_DATA.projects) || []).forEach(function (p) { NOMES[p.id] = p.title; });
  var ORIGEM = { direto: "Direto ou app de mensagem", google: "Google", busca: "Outras buscas", linkedin: "LinkedIn", whatsapp: "WhatsApp", instagram: "Instagram", github: "GitHub", outro: "Outros sites" };
  var CANAL = { whatsapp: "WhatsApp", linkedin: "LinkedIn", link: "Link copiado", nativo: "Compartilhar do celular" };
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); };
  var fmt = function (n) { return n.toLocaleString("pt-BR"); };

  // a chave chega no #k= do link; fica guardada neste navegador e sai da barra de endereço
  var chave = "";
  var m = location.hash.match(/k=([\w-]+)/);
  if (m) { chave = m[1]; try { localStorage.setItem("mm-visitas", chave); } catch (e) {} history.replaceState(null, "", location.pathname); }
  else { try { chave = localStorage.getItem("mm-visitas") || ""; } catch (e) {} }

  var dias = 30;
  try { dias = +localStorage.getItem("mm-visitas-dias") || 30; } catch (e) {}
  document.querySelectorAll("#periodo button").forEach(function (b) {
    b.setAttribute("aria-pressed", String(+b.dataset.d === dias));
    b.addEventListener("click", function () {
      dias = +b.dataset.d;
      try { localStorage.setItem("mm-visitas-dias", dias); } catch (e) {}
      document.querySelectorAll("#periodo button").forEach(function (x) { x.setAttribute("aria-pressed", String(x === b)); });
      carregar();
    });
  });

  function soma(linhas, f) { return linhas.filter(f).reduce(function (a, l) { return a + l.n; }, 0); }
  function grupo(linhas, f, k) {
    var o = {};
    linhas.filter(f).forEach(function (l) { o[l[k]] = (o[l[k]] || 0) + l.n; });
    return o;
  }
  function diasDoPeriodo(desde, hoje) {
    var out = [], d = new Date(desde + "T12:00:00Z"), fim = new Date(hoje + "T12:00:00Z");
    for (; d <= fim; d.setUTCDate(d.getUTCDate() + 1)) out.push(d.toISOString().slice(0, 10));
    return out;
  }
  var curto = function (iso) { return iso.slice(8, 10) + "/" + iso.slice(5, 7); };

  function grafico(serie) {
    var max = Math.max.apply(null, serie.map(function (s) { return s.n; })) || 0;
    var bars = serie.map(function (s) {
      var h = max ? Math.max(2, s.n / max * 100) : 0;
      return '<div class="bar' + (s.n ? "" : " zero") + '" data-d="' + s.dia + '" data-n="' + s.n + '"><i style="height:' + h + '%"></i></div>';
    }).join("");
    var tabela = serie.slice().reverse().map(function (s) { return "<tr><td>" + curto(s.dia) + '</td><td class="n' + (s.n ? "" : " zero") + '">' + s.n + "</td></tr>"; }).join("");
    return '<div class="chart"><span class="max">' + (max ? fmt(max) : "") + '</span><div class="bars" role="img" aria-label="Visitas por dia, de ' + curto(serie[0].dia) + " a " + curto(serie[serie.length - 1].dia) + '">' + bars + '</div><div class="tip" id="tip"></div></div>' +
      '<div class="axis"><span>' + curto(serie[0].dia) + "</span><span>" + curto(serie[serie.length - 1].dia) + "</span></div>" +
      '<details><summary>Ver em tabela</summary><div class="scroll"><table><thead><tr><th>Dia</th><th class="n">Visitas</th></tr></thead><tbody>' + tabela + "</tbody></table></div></details>";
  }

  function lista(titulo, cab, obj, nomes) {
    var ks = Object.keys(obj).sort(function (a, b) { return obj[b] - obj[a]; });
    if (!ks.length) return "<div><h2>" + titulo + '</h2><p class="label" style="text-transform:none;letter-spacing:0">Nada no período.</p></div>';
    var max = obj[ks[0]];
    return "<div><h2>" + titulo + '</h2><table><thead><tr><th>' + cab + '</th><th class="n">Total</th></tr></thead><tbody>' + ks.map(function (k) {
      return '<tr><td><div class="meter">' + esc(nomes[k] || k) + '<span><i style="width:' + (obj[k] / max * 100) + '%"></i></span></div></td><td class="n">' + fmt(obj[k]) + "</td></tr>";
    }).join("") + "</tbody></table></div>";
  }

  function render(d) {
    var L = d.linhas;
    var visitas = soma(L, function (l) { return l.e === "visita"; });
    var abertos = soma(L, function (l) { return l.e === "projeto"; });
    var compart = soma(L, function (l) { return l.e === "compartilhou"; });
    var chegou = soma(L, function (l) { return l.e === "chegou"; });
    var porDia = grupo(L, function (l) { return l.e === "visita"; }, "dia");
    var serie = diasDoPeriodo(d.desde, d.hoje).map(function (dia) { return { dia: dia, n: porDia[dia] || 0 }; });
    var en = soma(L, function (l) { return l.e === "visita" && l.l === "en"; });

    var ids = Object.keys(NOMES);
    var linhaProj = ids.map(function (id) {
      var c = function (e) { return soma(L, function (l) { return l.e === e && l.p === id; }); };
      var a = c("projeto"), s = c("compartilhou"), g = c("chegou");
      var td = function (n) { return '<td class="n' + (n ? "" : " zero") + '">' + fmt(n) + "</td>"; };
      return "<tr><td>" + esc(NOMES[id]) + "</td>" + td(a) + td(s) + td(g) + "</tr>";
    }).join("");

    var canais = {};
    Object.keys(CANAL).forEach(function (c) {
      canais[c] = [soma(L, function (l) { return l.e === "compartilhou" && l.m === c; }), soma(L, function (l) { return l.e === "chegou" && l.m === c; })];
    });
    var linhaCanal = Object.keys(CANAL).map(function (c) {
      var td = function (n) { return '<td class="n' + (n ? "" : " zero") + '">' + fmt(n) + "</td>"; };
      return "<tr><td>" + CANAL[c] + "</td>" + td(canais[c][0]) + td(canais[c][1]) + "</tr>";
    }).join("");

    box.innerHTML =
      '<div class="tiles">' +
        '<div class="tile"><span class="label">Visitas</span><b>' + fmt(visitas) + "</b><small>" + (visitas ? fmt(en) + " com o site em inglês" : "nos últimos " + dias + " dias") + "</small></div>" +
        '<div class="tile"><span class="label">Projetos abertos</span><b>' + fmt(abertos) + "</b><small>vezes que alguém abriu um projeto</small></div>" +
        '<div class="tile"><span class="label">Compartilhamentos</span><b>' + fmt(compart) + "</b><small>cliques em WhatsApp, LinkedIn, copiar ou compartilhar</small></div>" +
        '<div class="tile"><span class="label">Chegaram por link</span><b>' + fmt(chegou) + "</b><small>abriram um projeto por um link compartilhado</small></div>" +
      "</div>" +
      "<section><h2>Visitas por dia</h2>" + grafico(serie) + "</section>" +
      '<section><h2>Por projeto</h2><div class="scroll"><table><thead><tr><th>Projeto</th><th class="n">Aberto</th><th class="n">Compartilhado</th><th class="n">Chegou por link</th></tr></thead><tbody>' + linhaProj + "</tbody></table></div></section>" +
      '<section class="cols">' +
        lista("De onde vieram", "Origem", grupo(L, function (l) { return l.e === "visita"; }, "m"), ORIGEM) +
        '<div><h2>Por canal</h2><table><thead><tr><th>Canal</th><th class="n">Compartilhado</th><th class="n">Chegou</th></tr></thead><tbody>' + linhaCanal + "</tbody></table></div>" +
      "</section>";

    // dica ao passar o mouse (ou tocar) numa barra
    var tip = $("#tip"), chart = box.querySelector(".chart");
    box.querySelectorAll(".bar").forEach(function (b) {
      var show = function () {
        var r = b.getBoundingClientRect(), c = chart.getBoundingClientRect(), n = +b.dataset.n;
        tip.innerHTML = "<b>" + fmt(n) + "</b> " + (n === 1 ? "visita" : "visitas") + "<br>" + curto(b.dataset.d);
        tip.style.left = Math.min(Math.max(r.left - c.left + r.width / 2, 50), c.width - 50) + "px";
        tip.style.top = (r.bottom - c.top - b.firstChild.getBoundingClientRect().height) + "px";
        tip.classList.add("on");
      };
      b.addEventListener("pointerenter", show);
      b.addEventListener("pointerdown", show);
      b.addEventListener("pointerleave", function () { tip.classList.remove("on"); });
    });
  }

  function carregar() {
    if (!chave) { box.innerHTML = '<p class="msg">Abra esta página pelo link com a chave.</p>'; return; }
    fetch("/api/visitas?dias=" + dias, { headers: { "x-chave": chave }, cache: "no-store" })
      .then(function (r) {
        if (r.status === 401) { try { localStorage.removeItem("mm-visitas"); } catch (e) {} throw new Error("chave"); }
        if (!r.ok) throw new Error("falha");
        return r.json();
      })
      .then(render)
      .catch(function (e) {
        box.innerHTML = '<p class="msg">' + (e.message === "chave" ? "Essa chave não vale. Abra pelo link com a chave certa." : "Não deu pra carregar agora. Tente de novo em instantes.") + "</p>";
      });
  }
  carregar();
})();
</script>
</body>
</html>
