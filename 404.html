<!doctype html>
<html lang="pt">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>404 — Matheus Machado</title>
		<meta name="description" content="Página não encontrada — Portfólio de Matheus Machado." />
		<meta name="robots" content="noindex" />

		<link rel="icon" href="assets/img/fav-icon.png" type="image/png" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
		<link rel="stylesheet" href="styles/styles.css" />

		<style>
			html, body {
				min-height: 100vh;
			}

			.notfound-shell {
				min-height: 100vh;
				display: flex;
				align-items: center;
				justify-content: center;
				padding: 48px 24px;
				position: relative;
				z-index: 10;
			}

			.notfound-card {
				max-width: 640px;
				width: 100%;
				padding: 56px 48px;
				border: 1px solid hsl(var(--primary) / 0.28);
				border-radius: 20px;
				background:
					radial-gradient(540px circle at 50% 0%, hsl(var(--primary) / 0.10), transparent 60%),
					hsl(var(--card) / 0.6);
				box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
				text-align: center;
			}

			.notfound-kicker {
				display: inline-flex;
				align-items: center;
				gap: 10px;
				font-family: var(--font-mono);
				color: hsl(var(--primary));
				font-size: 0.95rem;
				letter-spacing: 0.04em;
				margin: 0;
			}

			.notfound-kicker::before {
				content: "";
				width: 8px;
				height: 8px;
				border-radius: 999px;
				background: hsl(var(--primary));
				box-shadow: 0 0 12px hsl(var(--primary));
			}

			.notfound-code {
				font-family: var(--font-display);
				font-weight: 900;
				font-size: clamp(4rem, 14vw, 7rem);
				line-height: 1;
				letter-spacing: -0.04em;
				margin: 18px 0 6px;
				background-image: var(--gradient-primary);
				-webkit-background-clip: text;
				background-clip: text;
				color: transparent;
			}

			.notfound-title {
				margin: 0 0 14px;
				font-size: clamp(1.25rem, 3vw, 1.6rem);
				font-weight: 800;
				color: hsl(var(--foreground));
			}

			.notfound-lead {
				margin: 0 auto 32px;
				font-size: 1rem;
				line-height: 1.55;
				color: hsl(var(--muted-foreground));
				max-width: 460px;
			}

			.notfound-actions {
				display: inline-flex;
				gap: 12px;
				flex-wrap: wrap;
				justify-content: center;
			}

			.notfound-code-line {
				margin-top: 36px;
				font-family: var(--font-mono);
				font-size: 0.85rem;
				color: hsl(var(--muted-foreground));
				opacity: 0.6;
			}

			.notfound-code-line .accent { color: hsl(var(--primary)); }

			@media (max-width: 560px) {
				.notfound-card {
					padding: 40px 24px;
				}
			}
		</style>

		<script>
			(function () {
				try {
					var saved = localStorage.getItem("mm_portfolio_lang");
					if (saved === "en" || saved === "pt") {
						document.documentElement.lang = saved;
						return;
					}
					var nav = (navigator.language || navigator.userLanguage || "pt").toLowerCase();
					document.documentElement.lang = nav.indexOf("pt") === 0 ? "pt" : "en";
				} catch (e) {}
			})();
		</script>
	</head>

	<body>
		<canvas id="code-bg" class="code-bg" aria-hidden="true"></canvas>

		<main class="notfound-shell">
			<div class="notfound-card">
				<p class="notfound-kicker">// route not found</p>
				<h1 class="notfound-code">404</h1>
				<p class="notfound-title" data-i18n-title>Página não encontrada</p>
				<p class="notfound-lead" data-i18n-lead>
					O endereço que você procura não existe ou foi movido. Vamos te levar de volta ao portfólio.
				</p>
				<div class="notfound-actions">
					<a href="/" class="btn-primary" data-i18n-cta>Voltar pro início</a>
				</div>
				<p class="notfound-code-line">
					<span class="accent">throw new</span> RouteNotFoundError(<span class="accent">"404"</span>);
				</p>
			</div>
		</main>

		<script>
			(function () {
				var lang = document.documentElement.lang === "en" ? "en" : "pt";
				var copy = {
					pt: {
						title: "Página não encontrada",
						lead: "O endereço que você procura não existe ou foi movido. Vamos te levar de volta ao portfólio.",
						cta: "Voltar pro início",
					},
					en: {
						title: "Page not found",
						lead: "The page you're looking for doesn't exist or has been moved. Let's take you back to the portfolio.",
						cta: "Back to home",
					},
				};
				document.querySelector("[data-i18n-title]").textContent = copy[lang].title;
				document.querySelector("[data-i18n-lead]").textContent = copy[lang].lead;
				document.querySelector("[data-i18n-cta]").textContent = copy[lang].cta;
			})();

			(function () {
				var canvas = document.getElementById("code-bg");
				if (!canvas) return;
				var ctx = canvas.getContext("2d");
				if (!ctx) return;
				var DPR = window.devicePixelRatio || 1;
				function resize() {
					canvas.width = Math.floor(window.innerWidth * DPR);
					canvas.height = Math.floor(window.innerHeight * DPR);
					canvas.style.width = window.innerWidth + "px";
					canvas.style.height = window.innerHeight + "px";
					ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
				}
				resize();
				window.addEventListener("resize", resize);
				var stars = [];
				for (var i = 0; i < 80; i++) {
					stars.push({
						x: Math.random() * window.innerWidth,
						y: Math.random() * window.innerHeight,
						size: Math.random() * 1.5 + 0.5,
						opacity: Math.random() * 0.4 + 0.2,
						twinklePhase: Math.random() * Math.PI * 2,
					});
				}
				var t = 0;
				function draw() {
					t += 0.016;
					ctx.fillStyle = "hsl(220, 20%, 4%)";
					ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);
					stars.forEach(function (s) {
						var twinkle = Math.sin(t * 0.6 + s.twinklePhase) * 0.3 + 0.7;
						ctx.beginPath();
						ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
						ctx.fillStyle = "rgba(150, 200, 180, " + s.opacity * twinkle + ")";
						ctx.fill();
					});
					requestAnimationFrame(draw);
				}
				draw();
			})();
		</script>
	</body>
</html>
