<!doctype html>
<html lang="pt">
	<head>
		<meta charset="UTF-8" />
		<title>OG Template</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;600;700;900&display=swap" rel="stylesheet" />
		<style>
			:root {
				--bg: hsl(220 20% 4%);
				--card: hsl(220 20% 6%);
				--primary: hsl(160 100% 50%);
				--cyan: hsl(180 100% 45%);
				--muted: hsl(220 10% 55%);
				--fg: hsl(0 0% 95%);
				--border: hsl(220 15% 15%);
				--font-display: "Space Grotesk", system-ui, sans-serif;
				--font-mono: "JetBrains Mono", ui-monospace, monospace;
			}

			* {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
			}

			html, body {
				width: 1200px;
				height: 630px;
				overflow: hidden;
			}

			body {
				font-family: var(--font-display);
				background: var(--bg);
				color: var(--fg);
				position: relative;
				display: flex;
				align-items: center;
			}

			.grid-bg {
				position: absolute;
				inset: 0;
				background-image:
					radial-gradient(900px circle at 80% 0%, hsl(160 100% 50% / 0.18), transparent 55%),
					radial-gradient(700px circle at 0% 100%, hsl(180 100% 45% / 0.10), transparent 60%),
					linear-gradient(hsl(220 15% 15% / 0.4) 1px, transparent 1px),
					linear-gradient(90deg, hsl(220 15% 15% / 0.4) 1px, transparent 1px);
				background-size: 100% 100%, 100% 100%, 48px 48px, 48px 48px;
				background-position: 0 0, 0 0, 0 0, 0 0;
				z-index: 0;
			}

			.code-line {
				position: absolute;
				font-family: var(--font-mono);
				font-size: 14px;
				color: hsl(160 100% 50% / 0.18);
				white-space: nowrap;
				z-index: 1;
			}

			.code-line.l1 { top: 56px; right: 60px; }
			.code-line.l2 { top: 92px; right: 80px; }
			.code-line.l3 { bottom: 70px; left: 60px; }
			.code-line.l4 { bottom: 38px; left: 80px; }

			.frame {
				position: absolute;
				inset: 32px;
				border: 1px solid hsl(160 100% 50% / 0.22);
				border-radius: 24px;
				z-index: 1;
				pointer-events: none;
			}

			.frame::before, .frame::after {
				content: "";
				position: absolute;
				width: 24px;
				height: 24px;
				border: 2px solid var(--primary);
			}

			.frame::before {
				top: -2px; left: -2px;
				border-right: 0; border-bottom: 0;
				border-top-left-radius: 24px;
			}

			.frame::after {
				bottom: -2px; right: -2px;
				border-left: 0; border-top: 0;
				border-bottom-right-radius: 24px;
			}

			.container {
				position: relative;
				z-index: 2;
				width: 100%;
				padding: 0 96px;
				display: flex;
				align-items: center;
				gap: 64px;
			}

			.left {
				flex: 1;
				min-width: 0;
			}

			.kicker {
				display: inline-flex;
				align-items: center;
				gap: 10px;
				font-family: var(--font-mono);
				font-size: 18px;
				color: var(--primary);
				letter-spacing: 0.04em;
				margin-bottom: 18px;
			}

			.kicker .dot {
				width: 10px;
				height: 10px;
				border-radius: 999px;
				background: var(--primary);
				box-shadow: 0 0 16px var(--primary);
			}

			.name {
				font-size: 84px;
				font-weight: 900;
				line-height: 0.98;
				letter-spacing: -0.035em;
				background: linear-gradient(135deg, var(--primary), var(--cyan));
				-webkit-background-clip: text;
				background-clip: text;
				color: transparent;
				margin-bottom: 18px;
			}

			.title {
				font-family: var(--font-mono);
				font-size: 30px;
				font-weight: 500;
				color: var(--fg);
				margin-bottom: 22px;
			}

			.title .accent { color: var(--primary); }

			.tags {
				display: flex;
				gap: 12px;
				flex-wrap: wrap;
			}

			.tag {
				font-family: var(--font-mono);
				font-size: 18px;
				padding: 8px 16px;
				border: 1px solid hsl(160 100% 50% / 0.35);
				border-radius: 999px;
				background: hsl(160 100% 50% / 0.06);
				color: var(--fg);
			}

			.right {
				width: 320px;
				height: 320px;
				flex-shrink: 0;
				position: relative;
				display: flex;
				align-items: center;
				justify-content: center;
			}

			.right .ring {
				position: absolute;
				inset: 0;
				border-radius: 999px;
				border: 2px dashed hsl(160 100% 50% / 0.45);
			}

			.right .glow {
				position: absolute;
				inset: 12px;
				border-radius: 999px;
				background: radial-gradient(circle, hsl(160 100% 50% / 0.32), transparent 70%);
				filter: blur(20px);
			}

			.right .core {
				position: relative;
				width: 240px;
				height: 240px;
				border-radius: 999px;
				border: 2px solid hsl(160 100% 50% / 0.6);
				background:
					radial-gradient(circle at 30% 30%, hsl(160 100% 50% / 0.18), transparent 60%),
					linear-gradient(135deg, hsl(220 20% 8%), hsl(220 20% 4%));
				display: flex;
				align-items: center;
				justify-content: center;
				font-family: var(--font-mono);
				font-size: 88px;
				font-weight: 700;
				color: var(--primary);
				text-shadow: 0 0 24px hsl(160 100% 50% / 0.6);
				box-shadow: 0 0 60px hsl(160 100% 50% / 0.3);
			}

			.right .float {
				position: absolute;
				font-family: var(--font-mono);
				font-size: 18px;
				padding: 8px 14px;
				border-radius: 10px;
				border: 1px solid hsl(160 100% 50% / 0.35);
				background: hsl(220 20% 6% / 0.9);
				color: var(--primary);
			}

			.right .float-top {
				top: -4px;
				right: -12px;
			}

			.right .float-bottom {
				bottom: 4px;
				left: -28px;
			}

			.url {
				position: absolute;
				bottom: 56px;
				right: 96px;
				font-family: var(--font-mono);
				font-size: 18px;
				color: var(--muted);
				letter-spacing: 0.02em;
				z-index: 2;
			}

			.url .arrow { color: var(--primary); margin-right: 6px; }
		</style>
	</head>

	<body>
		<div class="grid-bg"></div>

		<div class="code-line l1">const developer = {</div>
		<div class="code-line l2">  passion: "∞"</div>
		<div class="code-line l3">function createSolution() {</div>
		<div class="code-line l4">  return innovation;</div>

		<div class="frame"></div>

		<div class="container">
			<div class="left">
				<div class="kicker">
					<span class="dot"></span>
					<span>// FULL STACK DEVELOPER</span>
				</div>

				<h1 class="name">Matheus<br />Machado</h1>

				<p class="title">
					<span class="accent">&lt;React /&gt;</span> · Python · SQL · Web Scraping
				</p>

				<div class="tags">
					<span class="tag">Automação</span>
					<span class="tag">Full Stack</span>
					<span class="tag">Data</span>
				</div>
			</div>

			<div class="right">
				<div class="ring"></div>
				<div class="glow"></div>
				<div class="core">MM</div>
				<div class="float float-top">&lt;/&gt;</div>
				<div class="float float-bottom">{ }</div>
			</div>
		</div>

		<div class="url">
			<span class="arrow">▸</span>matheus-machado-dev.com.br
		</div>
	</body>
</html>
