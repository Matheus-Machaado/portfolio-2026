<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Matheus Machado | Projeto</title>
<script>
  (function () {
    var id = "";
    try { id = new URLSearchParams(location.search).get("id") || ""; } catch (e) {}
    if (!id) { var m = location.pathname.match(/\/projeto\/([\w-]+)/); if (m) id = m[1]; }
    location.replace("/" + (id ? "#p-" + id : "#projetos"));
  })();
</script>
</head>
<body><a href="/#projetos">Ver projetos</a></body>
</html>
