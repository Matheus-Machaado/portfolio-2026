<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>404 | Matheus Machado</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0c0b0a">
<link rel="icon" href="/assets/img/fav-icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&display=swap">
<link rel="stylesheet" href="/styles/site.css?v=20261030e">
<style>
  .nf { min-height: 100svh; display: grid; align-content: center; gap: 28px; padding-block: 60px; }
  .nf h1 { margin: 0; font-weight: 900; font-variation-settings: "wdth" 62; font-size: clamp(140px, 30vw, 420px); line-height: .78; }
  .nf p { margin: 0; max-width: 34ch; font-size: clamp(22px, 2.4vw, 32px); line-height: 1.15; font-weight: 800; letter-spacing: -.02em; }
  .nf p span { color: var(--muted); }
</style>
</head>
<body>
<main class="nf wrap">
  <span class="label sec-label" id="k">(Página não encontrada)</span>
  <h1>404</h1>
  <p id="m">Esse endereço não existe. <span>O resto do portfólio está aqui.</span></p>
  <div class="actions"><a class="pill solid" id="b" href="/"><span>Voltar pro início</span><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 12 12 4M5.5 4H12v6.5"/></svg></a></div>
</main>
<script>
  try {
    if ((localStorage.getItem("mm-lang") || (navigator.language || "pt")).toLowerCase().indexOf("en") === 0) {
      document.documentElement.lang = "en";
      document.getElementById("k").textContent = "(Page not found)";
      document.getElementById("m").innerHTML = "This address doesn't exist. <span>The rest of the portfolio is here.</span>";
      document.querySelector("#b span").textContent = "Back to home";
    }
  } catch (e) {}
</script>
</body>
</html>
